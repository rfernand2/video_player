<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' file:">
  <title>Video Player</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="stage">
    <video id="video" preload="auto"></video>
    <canvas id="still" hidden></canvas> <!-- the current frame while paused; see player.js -->

    <!-- Sized by app.js to exactly cover the visible picture (inside any letterboxing). -->
    <div id="picture">
      <div id="overlay" class="overlay">
        <div id="tc" class="tc">00:00:00:00</div>
        <div id="tc-sub" class="tc-sub"></div>
      </div>
    </div>

    <section id="welcome">
      <h1>Video Player</h1>
      <p>Drop a video here, or press <kbd>Ctrl</kbd>+<kbd>O</kbd>.</p>
      <dl id="shortcuts"></dl>
    </section>

    <div id="note-editor" class="note-editor" hidden>
      <div class="note-heading"></div>
      <textarea rows="4" placeholder="Type a note…" spellcheck="true"></textarea>
      <div class="note-hint"><kbd>Enter</kbd> save · <kbd>Shift</kbd>+<kbd>Enter</kbd> new line · <kbd>Esc</kbd> cancel</div>
    </div>

    <div id="toast" role="status"></div>
  </main>

  <footer id="controls">
    <div id="timeline" class="timeline">
      <canvas></canvas>
      <div class="fill"></div>
      <div class="head"></div>
    </div>

    <div class="row">
      <button id="play" class="icon" tabindex="-1" title="Play / pause">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path class="when-paused" d="M4 2.5v11l9-5.5z"/>
          <path class="when-playing" d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/>
        </svg>
      </button>

      <div class="clock"><span id="clock-now">00:00:00:00</span><span class="dim"> / <span id="clock-end">00:00:00:00</span></span></div>

      <div class="spacer"></div>

      <div class="group" title="Shot detection. Drag to change how strong a cut must be.">
        <span id="shots-label" class="dim">Shots —</span>
        <input id="threshold" type="range" min="0.05" max="0.9" step="0.01" tabindex="-1" aria-label="Shot detection threshold">
        <span id="threshold-value" class="dim num"></span>
      </div>

      <button id="scrub" class="toggle" tabindex="-1" aria-pressed="false">Scrub audio</button>

      <div class="group">
        <button id="mute" class="icon" tabindex="-1" title="Mute">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2 6h2.5L8 3v10L4.5 10H2z"/>
            <path class="when-unmuted" d="M10 5.5a3.5 3.5 0 0 1 0 5M11.8 3.6a6 6 0 0 1 0 8.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <path class="when-muted" d="M10.5 6l4 4M14.5 6l-4 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </button>
        <input id="volume" type="range" min="0" max="1" step="0.01" tabindex="-1" aria-label="Volume">
      </div>

      <button id="open" tabindex="-1">Open…</button>
    </div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
